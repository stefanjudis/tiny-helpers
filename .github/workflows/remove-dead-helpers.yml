name: Remove dead helpers
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency: remove-dead-helpers
jobs:
  remove-dead-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Restore or cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
      - name: Check helpers on Checkly
        id: checkly
        env:
          CHECKLY_API_KEY: ${{ secrets.CHECKLY_API_KEY }}
          CHECKLY_ACCOUNT_ID: ${{ secrets.CHECKLY_ACCOUNT_ID }}
          FORCE_COLOR: 0
        # The check fails when helpers are dead; the next step decides what that means.
        run: |
          set +e
          npx checkly test helper-availability --location eu-central-1 --reporter ci --verbose \
            | tee "$RUNNER_TEMP/checkly-output.txt"
          echo "exit-code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Remove dead helpers
        id: remove
        env:
          SUMMARY_FILE: ${{ runner.temp }}/dead-helpers-summary.md
        run: node scripts/remove-dead-helpers.js "$RUNNER_TEMP/checkly-output.txt"
      - name: Fail if the check broke without reporting dead helpers
        if: steps.checkly.outputs.exit-code != '0' && steps.remove.outputs.dead == 0
        run: echo "The check failed without reporting dead helpers." && exit 1
      - name: Create pull request
        if: steps.remove.outputs.removed > 0
        uses: peter-evans/create-pull-request@v7
        with:
          branch: remove-dead-helpers
          delete-branch: true
          title: Remove unavailable helpers
          commit-message: Remove unavailable helpers
          body-path: ${{ runner.temp }}/dead-helpers-summary.md
          add-paths: helpers/
